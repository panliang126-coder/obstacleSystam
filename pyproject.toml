[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "low-altitude-ai-system"
version = "0.1.0"
description = "Low Altitude Intelligent Perception and Decision System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema[format]>=4.23,<5",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.68,<2",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.8,<1",
    "types-jsonschema>=4.23,<5",
]

[project.scripts]
obstacle-schema = "low_altitude_ai.schemas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "contract: validates a public interface contract",
    "architecture: validates dependency direction",
]

[tool.coverage.run]
source = ["low_altitude_ai"]
# Protocol declarations define contracts but contain no executable implementation.
omit = ["src/low_altitude_ai/ports/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
